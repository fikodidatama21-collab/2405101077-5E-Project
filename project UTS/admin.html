<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Admin – TamaaStore</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .loginbox {
        max-width: 360px;
        margin: 12vh auto;
        padding: 24px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .loginbox input,
      .box select {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 10px;
        padding: 10px;
        font: inherit;
      }
      .loginbox .cta {
        width: 100%;
        margin-top: 12px;
      }
      #stats {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        margin: 24px 0;
      }
      .tw {
        overflow-x: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
      }
      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        font-size: 0.92rem;
      }
      th {
        color: var(--muted);
        font-weight: 700;
      }
      td select {
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 8px;
        padding: 6px;
        font: inherit;
      }
      .bar2 {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      #imp {
        margin-bottom: 14px;
      }
      #imp textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 10px;
        padding: 10px;
        font: inherit;
      }
      td.empty {
        text-align: center;
        color: var(--muted);
        padding: 30px;
      }
    </style>
  </head>
  <body>
    <div id="login" class="loginbox">
      <h2>Masuk admin</h2>
      <p class="meta">Khusus pemilik toko TamaaStore.id </p>
      <label for="pw" class="meta">Password</label>
      <input id="pw" type="password" autocomplete="current-password" />
      <p id="lerr" class="meta" style="color: var(--hot)" role="alert"></p>
      <button class="cta" id="lgo">Masuk</button>
    </div>

    <div id="app" hidden>
      <header>
        <div class="wrap bar">
          <span class="logo">Tamaa<b>Store</b> Admin</span
          ><span style="margin-right: auto"></span
          ><button class="ib" id="out">Keluar</button>
        </div>
      </header>
      <main class="wrap">
        <div id="stats" class="stats"></div>
        <div class="tools">
          <input
            id="q"
            type="search"
            placeholder="Cari no. pesanan, nama, atau WhatsApp"
            aria-label="Cari pesanan"
          />
          <select id="fs" aria-label="Filter status"></select>
        </div>
        <div class="bar2">
          <button class="ghost" id="bImp">Impor kode dari WhatsApp</button>
          <button class="ghost" id="bCsv">Ekspor CSV</button>
          <button class="ghost" id="bDemo">Isi data contoh</button>
        </div>
        <div id="imp" hidden>
          <p class="meta">
            Tempel pesan WhatsApp dari pembeli (yang berisi baris "Kode
            pesanan"). Boleh beberapa pesan sekaligus.
          </p>
          <textarea id="impText" rows="4"></textarea>
          <button class="cta" id="impGo" style="margin-top: 8px">
            Tambahkan pesanan
          </button>
        </div>
        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>Pesanan</th>
                <th>Pembeli</th>
                <th>Total</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="meta" style="margin: 14px 0 40px">
          Data tersimpan di browser ini. Ekspor CSV secara berkala sebagai
          cadangan.
        </p>
      </main>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="box" id="mBody"></div>
    </div>
    <div id="toast" role="status"></div>
    <script src="admin.js"></script>
  </body>
</html>
